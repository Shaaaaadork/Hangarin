{% extends 'base.html' %}

{% block title %}Categories | Hangarin{% endblock %}

{% block content %}
<div class="pt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Category Admin</h2>
    </div>

    <div class="bg-white p-3 rounded shadow-sm mb-4">
        <form method="get" class="d-flex gap-2">
            <input type="text" name="q" class="form-control" placeholder="Search category name..." value="{{ request.GET.q }}">
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
    </div>

    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
                <tr>
                    <th class="py-3">Category Name</th>
                </tr>
            </thead>
            <tbody>
                {% for category in categories %}
                <tr>
                    <td class="py-3 fw-bold">{{ category.name }}</td>
                </tr>
                {% empty %}
                <tr><td class="text-center py-4">No categories found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
