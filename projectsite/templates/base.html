{% load static %}
{% load pwa %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Hangarin Admin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height: 100vh; background: #212529; color: white; }
        .nav-link { color: #adb5bd; }
        .nav-link:hover, .nav-link.active { color: #ffc107; background: #343a40; }
        .main-content { background: #f8f9fa; }
    </style>
    {% progressive_web_app_meta %}
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar p-3 position-fixed">
            <h3 class="text-warning fw-bold mb-4 px-2">HANGARIN</h3>
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link rounded mb-2" href="{% url 'task-list' %}"><i class="bi bi-list-check me-2"></i> Tasks</a></li>
                <li class="nav-item"><a class="nav-link rounded mb-2" href="{% url 'subtask-list' %}"><i class="bi bi-layers me-2"></i> SubTasks</a></li>
                <li class="nav-item"><a class="nav-link rounded mb-2" href="{% url 'category-list' %}"><i class="bi bi-tags me-2"></i> Categories</a></li>
                <li class="nav-item"><a class="nav-link rounded mb-2" href="{% url 'priority-list' %}"><i class="bi bi-flag me-2"></i> Priorities</a></li>
                <li class="nav-item"><a class="nav-link rounded mb-2" href="{% url 'note-list' %}"><i class="bi bi-sticky me-2"></i> Notes</a></li>
            </ul>
            <hr>
            <form action="{% url 'logout' %}" method="post" class="px-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-danger w-100">Logout</button>
            </form>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 main-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
